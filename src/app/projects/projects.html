<section class="projects">
  <div class="container">
    <h2>Projects</h2>
    <div class="cards">
      @for(project of myProjects ; track project){
      <div class="card text-center">
        <h4>{{project.title}}</h4>
        <p>{{project.description}}</p>
      </div>
      }
    </div>
  </div>
</section>
